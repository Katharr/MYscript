</style></head><body><div id="app"></div><div class="preview-dock"><span class="dock-title">3.0 · 浅色工作台</span><a href="?variant=A&amp;version=1">1.0 候选</a><a class="active" href="?variant=A&amp;version=3">3.0 浅色</a><span class="badge">视觉原型</span><span class="dock-extra">模拟数据 · 不连接游戏</span><button id="scenario">切换缺标定场景</button><button id="show-state">查看状态</button></div><div id="overlay"></div><pre id="state-view" class="state-view hidden"></pre><div id="toast" class="toast hidden" role="status"></div>
<script>
const paths={brand:'M12 2 22 12 12 22 2 12z M12 6l3 6-3 6-3-6z M6 12h3 M15 12h3',chain:'M4 5h5v5H4z M15 14h5v5h-5z M9 7h7a2 2 0 0 1 2 2v5 M6 10v5a2 2 0 0 0 2 2h7',grid:'M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h6v6h-6z',click:'m8 3 10 9-6 1-3 6z M15 16l3 4',window:'M3 5h18v14H3z M3 9h18 M6 7h.1 M9 7h.1',target:'M12 3v3 M12 18v3 M3 12h3 M18 12h3 M18 12a6 6 0 1 1-12 0 6 6 0 0 1 12 0 M14 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0',tools:'m14 5 4 4 M4 20l10-10 M14 10a5 5 0 0 1 5-7l-3 3 2 2 3-3a5 5 0 0 1-7 5 M5 16l3 3',settings:'M9 3h6l1 3 3 1 2 5-2 4-3 1-1 4H9l-1-4-3-1-2-4 2-5 3-1z M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0',map:'m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2z M9 3v16 M15 5v16 M5 10l2-1 M17 12l2-1',escort:'m12 3 8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6z M8 12l3 3 5-6',realm:'m2 19 7-13 4 7 3-5 6 11z M7 10l2 2 2-2 M15 4h.1',dungeon:'M5 21V7l7-4 7 4v14 M9 21v-8h6v8 M3 21h18 M8 7h8 M7 10h10',edit:'m4 17 11-11 3 3L7 20H4z M14 7l3 3 M16 5l2-2 3 3-2 2',play:'m8 4 12 8-12 8z',stop:'M5 5h14v14H5z',chevron:'m9 5 7 7-7 7',down:'m6 9 6 6 6-6',close:'m6 6 12 12 M18 6 6 18',log:'M5 4h14v16H5z M8 8h8 M8 12h8 M8 16h5',check:'m5 12 4 4L19 6',clock:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0 M12 7v5l3 2',more:'M5 12h.01 M12 12h.01 M19 12h.01',plus:'M12 5v14 M5 12h14',sliders:'M4 6h7 M15 6h5 M4 12h3 M11 12h9 M4 18h11 M19 18h1 M11 3v6 M7 9v6 M15 15v6',back:'m14 6-6 6 6 6',shield:'m12 3 8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6z M12 8v5 M12 16h.01'};
function icon(n){return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.grid}"/></svg>`}
const roles=[{name:'清风',level:89,avatar:'清'},{name:'晚星',level:89,avatar:'星'},{name:'听雨',level:89,avatar:'雨'},{name:'云舟',level:89,avatar:'舟'}];
const state={version:'3.0',variant:'A',page:'日常一条龙',selection:[true,true,true,false],captain:0,running:false,logOpen:false,logHidden:false,missing:false,time:0,selected:0,single:'宝图',tasks:[{name:'宝图',icon:'map',on:true,live:false},{name:'运镖',icon:'escort',on:true,live:false},{name:'秘境降妖',icon:'realm',on:true,live:false},{name:'刷副本',icon:'dungeon',on:true,live:false}],steps:['确认按钮','领奖按钮','关闭弹窗'],events:[{message:'任务配置已载入',time:'14:32:08'},{message:'已选择 3 个执行角色',time:'14:32:06'},{message:'窗口尺寸一致',time:'14:32:05'}]};
const btn=(label,action,cls='',ico)=>`<button class="${cls}" data-action="${action}" ${!label?`aria-label="${action==='listmenu'?'管理清单':action.startsWith('editstep:')?'编辑步骤'+(Number(action.split(':')[1])+1):action==='close'?'关闭面板':'更多操作'}"`:""}>${ico?icon(ico):''}${label}</button>`;
const pill=(label,cls='')=>`<span class="pill ${cls}">${label}</span>`;
function debug(){document.querySelector('#state-view').textContent=JSON.stringify(state,null,2);console.info('UI prototype state',JSON.parse(JSON.stringify(state)))}
function notify(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.add('hidden'),2400)}
function event(message,error=false){state.events.unshift({message,time:new Date().toLocaleTimeString('zh-CN',{hour12:false}),error})}
function nav(){return `<aside class="nav"><div class="brand"><span class="brand-mark">梦</span><span class="brand-text">梦幻小助手</span></div><div class="nav-items"><div class="nav-group">任务</div>${[['日常一条龙','chain'],['单项任务','grid'],['自由点击','click']].map(([n,i])=>`<button data-page="${n}" title="${n}" class="${state.page===n?'active':''}">${icon(i)}<span class="nav-label">${n}</span></button>`).join('')}<div class="nav-group">管理</div>${[['角色与窗口','window'],['标定中心','target'],['通用工具','tools']].map(([n,i])=>`<button data-page="${n}" title="${n}" class="${state.page===n?'active':''}">${icon(i)}<span class="nav-label">${n}</span></button>`).join('')}</div><div class="nav-footer">${btn('<span class="nav-label">设置与关于</span>','settings','','settings')}<div class="nav-status"><span class="dot"></span>本地运行<span style="float:right">就绪</span></div></div></aside>`}
function roleBand(){return `<section class="role-band"><div class="role-title"><span>执行角色</span><span>${state.selection.filter(Boolean).length} / ${roles.length} 已选</span></div><div class="roles">${roles.map((r,i)=>`<div class="role ${state.selection[i]?'selected':''}"><div class="avatar v${i}">${r.avatar}</div><div class="role-main"><label class="role-check"><span class="role-name grow">${r.name}<em>${r.level}级</em></span><input type="checkbox" data-role="${i}" aria-label="选择${r.name}" ${state.selection[i]?'checked':''} ${state.running?'disabled':''}></label><div class="role-bottom"><span class="grow">${state.running&&state.selection[i]?'执行中':'空闲'}</span><label><input aria-label="设${r.name}为队长" type="radio" name="captain" data-captain="${i}" ${state.captain===i?'checked':''} ${state.running||!state.selection[i]?'disabled':''}>队长</label></div></div></div>`).join('')}</div></section>`}
function logs(){return `<aside class="log ${state.logOpen?'overlay-open':''}" aria-label="运行日志"><div class="log-heading"><h2>运行日志</h2><button title="收起日志" aria-label="收起日志" data-action="log">${icon('log')}</button></div><div class="log-tabs"><span class="active">本次运行</span><span>${state.running?'正在执行':'待机'}</span></div><div class="log-events">${state.events.map(e=>`<div class="event ${e.error?'error':''}"><time>${e.time}</time>${e.message}</div>`).join('')}${!state.running?'<div class="empty-log">等待任务启动</div>':''}</div><div class="log-footer"><div class="row">${icon('shield')}<span>全局急停</span></div><kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>F12</kbd></div></aside>`}
function heading(title,ico,extra=''){return `<div class="page-heading"><div class="row"><div class="heading-icon">${icon(ico)}</div><div><h1>${title}</h1><div class="sub-status">${state.running?'正在运行':state.page==='日常一条龙'?'沿用各任务运行模式':state.page==='单项任务'?'单项运行':'待机'}</div></div></div>${extra}</div>`}
function taskRows(){return `<div><div class="sequence-header"><span>执行顺序</span><small>${state.tasks.filter(t=>t.on).length} 项任务</small></div><div class="task-list">${state.tasks.map((t,i)=>`<div class="task-row ${!t.on?'off':''}" draggable="${!state.running}" data-drag="${i}"><span class="sequence-number" title="拖动调整顺序">${i+1}</span><div class="task-identity"><label class="task-enable"><input type="checkbox" aria-label="启用${t.name}" data-task="${i}" ${t.on?'checked':''} ${state.running?'disabled':''}></label><div class="task-icon ${t.icon}">${icon(t.icon)}</div><div><div class="task-name">${t.name}</div><div class="task-meta">${t.name==='刷副本'?'队伍任务':'角色任务'}</div></div></div><button class="mode-button ${t.live?'is-live':''}" data-config="${i}" aria-label="${t.name}运行模式">${t.live?'实战':'演练'}${icon('down')}</button><div class="readiness">${pill(!t.on?'已停用':state.missing&&t.name==='宝图'?'缺少标定':t.live?(state.running?'执行中':'已就绪'):'实跑跳过',state.missing&&t.name==='宝图'?'warn':!t.live?'dry':'')}</div><button class="edit" data-config="${i}" aria-label="配置${t.name}" title="配置${t.name}">${icon('sliders')}</button></div>`).join('')}</div></div>`}
function execution(label='开始一条龙'){const daily=state.page==='日常一条龙',n=state.tasks.filter(t=>t.on&&t.live).length;return `<footer class="execution-bar"><div class="execution-info">${icon(state.running?'clock':'shield')}<div><strong>${state.running?'模拟运行中':daily?state.tasks.filter(t=>t.on).length+' 项已启用，'+n+' 项可实跑':'演练模式'}</strong><small>${state.running?'执行目标已锁定':state.selection.filter(Boolean).length+' 个执行角色'+(daily?' · 演练项自动跳过':' · 仅识别，不执行点击')}</small></div></div>${state.running?btn('停止任务','stop','danger','stop'):btn(label,'start','primary','play')}</footer>`}
function daily(){return `${heading('日常一条龙','chain',btn('运行设置','runsettings','quiet','sliders'))}<div class="scroll-body">${state.missing?'<div class="notice">宝图缺少必要标定，请先完成标定。</div>':''}${taskRows()}<div class="inline-settings"><span class="row">${icon('clock')}时间上限 · ${state.time?state.time+' 分钟':'不限'}</span>${btn('调整顺序','order','link')}</div></div>${execution()}`}
function freeclick(){return `${heading('自由点击','click',pill('演练','dry'))}<div class="scroll-body"><div class="list-actions"><select aria-label="点击清单" class="grow"><option>日常确认清单</option></select>${btn('添加截图','addshot','','plus')}${btn('','listmenu','quiet','more')}</div><div class="panel"><div class="panel-head"><small>点击步骤</small><small>${state.steps.length} 项</small></div>${state.steps.map((n,i)=>`<div class="panel-row"><span class="muted">⠿</span><div class="step-thumb">${n.slice(0,2)}</div><span class="grow">${n}</span>${pill('已标定')}${btn('','editstep:'+i,'quiet','edit')}</div>`).join('')}</div><div class="inline-settings"><span>识别区域 · 整窗</span>${btn('区域设置','region','link')}</div></div>${execution('开始自由点击')}`}
function calibration(){return `${heading('标定中心','target',btn('标准尺寸组','sizes','quiet','window'))}<div class="scroll-body"><div class="row">${btn('通用标定','commontab','link')}${btn('任务标定','tasktab','quiet')}</div><div class="panel">${['主识别区','活动列表区域','战斗标志','活动参加','确认','确定'].map((n,i)=>`<div class="panel-row"><div class="task-icon ${i<2?'escort':'realm'}">${icon(i<2?'window':'target')}</div><span class="grow">${n}</span>${pill(i===0&&state.missing?'未标定':'通用',i===0&&state.missing?'warn':'')}${btn('标定','calibrate:'+i,'link')}</div>`).join('')}</div></div>`}
const singleTasks=[['宝图','map'],['运镖','escort'],['秘境降妖','realm'],['刷副本','dungeon'],['秒装备','target']];
function single(){const t=state.tasks.find(t=>t.name===state.single)||{name:'秒装备',icon:'target',live:false};const index=singleTasks.findIndex(([n])=>n===state.single);return `${heading('单项任务','grid')}<div class="scroll-body"><div class="single-tabs" role="tablist" aria-label="单项任务">${singleTasks.map(([n],i)=>`<button role="tab" class="single-tab" id="single-tab-${i}" aria-selected="${n===state.single}" aria-controls="single-panel" tabindex="${n===state.single?0:-1}" data-single="${n}" ${state.running?'disabled':''}>${n}</button>`).join('')}</div><section class="panel single-panel" role="tabpanel" id="single-panel" aria-labelledby="single-tab-${index}" tabindex="0"><div class="panel-head"><div class="row"><div class="task-icon ${t.icon}">${icon(t.icon)}</div><h2>${t.name}</h2></div>${pill(t.live?'实战':'演练',t.live?'live':'dry')}</div><div class="panel-row"><span class="grow">运行参数</span>${btn('配置','singleconfig','link','sliders')}</div><div class="panel-row"><span class="grow">标定状态</span>${pill(state.missing?'缺少标定':'已就绪',state.missing?'warn':'')}${btn('查看','tasktab','link')}</div></section></div>${execution('开始'+t.name)}`}
function management(){const isRole=state.page==='角色与窗口';return `${heading(state.page,isRole?'window':'tools')}<div class="scroll-body">${isRole?`<div class="panel">${[['启动与登录','window'],['窗口尺寸组','grid']].map(([n,i])=>`<div class="panel-row">${icon(i)}<span class="grow">${n}</span>${btn('打开','placeholder:'+n,'quiet','chevron')}</div>`).join('')}</div>`:`<div class="tool-groups">${[['队伍','chain',['一键组队','一键解散']],['背包','grid',['整理背包','管理物品']]].map(([group,ico,actions])=>`<section class="panel tool-group" aria-label="${group}"><div class="tool-group-heading">${icon(ico)}<h2>${group}</h2></div><div class="tool-group-actions">${actions.map(n=>btn(n,'placeholder:'+n)).join('')}</div></section>`).join('')}</div>`}</div>`}
function render(){document.querySelector('#app').innerHTML=`<div class="app">${nav()}<section class="workspace"><header class="topbar"><span class="breadcrumb">${['角色与窗口','标定中心','通用工具'].includes(state.page)?'管理':'任务'}<strong>/ &nbsp; ${state.page}</strong></span><span class="grow"></span><div class="window-actions row" aria-label="窗口快捷操作">${btn('唤出','wake','quiet','window')}${btn('全关','close-windows','quiet close-all','close')}${btn('日志','log','quiet','log')}</div></header>${roleBand()}<div class="work-body ${state.logHidden?'log-closed':''}"><main class="main">${state.page==='日常一条龙'?daily():state.page==='自由点击'?freeclick():state.page==='标定中心'?calibration():state.page==='单项任务'?single():management()}</main>${logs()}</div></section></div>`;debug()}
function drawer(title,content){document.querySelector('#overlay').innerHTML=`<div class="dialog-shade"><section class="drawer" role="dialog" aria-modal="true" aria-label="${title}"><div class="drawer-head"><h2>${title}</h2>${btn('','close','quiet','close')}</div>${content}</section></div>`;document.querySelector('.drawer-head button').setAttribute('aria-label','关闭面板');document.querySelector('.drawer-head button').focus()}
function config(i){state.selected=i;const t=state.tasks[i];drawer(t.name+'配置',`<div class="row"><div class="task-icon ${t.icon}">${icon(t.icon)}</div><span>${t.name}</span></div><div class="form-row"><span>运行模式</span><select id="mode" aria-label="运行模式" ${state.running?'disabled':''}><option value="dry" ${!t.live?'selected':''}>演练</option><option value="live" ${t.live?'selected':''}>实战</option></select></div><div class="notice">实战模式会执行真实操作</div><h3>启动条件</h3><div class="form-row"><span>执行角色</span><strong>${state.selection.filter(Boolean).length} 个</strong></div><div class="form-row"><span>标定状态</span>${pill(state.missing&&t.name==='宝图'?'缺少标定':'已就绪',state.missing&&t.name==='宝图'?'warn':'')}</div><div class="form-row"><span>标定清单</span>${btn('查看','tasktab','link')}</div>${btn('完成','close','primary')}`);debug()}
function act(a){if(a==='close'){document.querySelector('#overlay').innerHTML='';return}if(a==='log'){if(innerWidth<=1050){state.logOpen=!state.logOpen;state.logHidden=false}else state.logHidden=!state.logHidden;render();return}if(a==='start'){const issue=!state.selection.some(Boolean)?'未选择执行角色':state.missing?'缺少必要标定':state.page==='日常一条龙'&&!state.tasks.some(t=>t.on&&t.live)?'没有可实跑任务：当前子任务均为演练或未启用':'';if(issue){event(issue,true);render();drawer('无法启动',`<div class="notice">${issue}</div>${btn('返回配置','close','primary')}`)}else{state.running=true;event('模拟任务已启动，执行目标已锁定');render()}return}if(a==='stop'){state.running=false;event('模拟任务已停止');render();return}if(a==='runsettings'){drawer('运行设置',`<div class="form-row"><span>整体时间上限</span><label><input id="time" aria-label="整体时间上限" type="number" min="0" value="${state.time}" ${state.running?'disabled':''}> 分钟</label></div><p class="field-label">0 分钟 · 不限</p>${btn('完成','close','primary')}`);return}if(a==='order'){drawer('调整任务顺序',`<div class="toggle-menu">${state.tasks.map((t,i)=>`<div class="form-row"><span class="grow">${i+1}. ${t.name}</span>${btn('上移','up:'+i,'quiet')}${btn('下移','down:'+i,'quiet')}</div>`).join('')}</div>`);return}if(a.startsWith('up:')||a.startsWith('down:')){if(state.running)return;const i=Number(a.split(':')[1]),j=i+(a.startsWith('up:')?-1:1);if(j>=0&&j<state.tasks.length){[state.tasks[i],state.tasks[j]]=[state.tasks[j],state.tasks[i]];render();act('order')}return}if(a==='wake'){event('已模拟唤出所有游戏窗口');render();notify('已模拟唤出窗口');return}if(a==='close-windows'){drawer('全关游戏窗口',`<div class="notice">确认关闭所有游戏窗口？</div>${btn('取消','close','quiet')}${btn('确认全关','confirm-close-windows','danger')}`);return}if(a==='confirm-close-windows'){document.querySelector('#overlay').innerHTML='';event('已模拟关闭所有游戏窗口');render();notify('已模拟全关，不操作实际窗口');return}if(a==='all'||a==='none'){if(state.running){notify('运行中不可更改执行角色');return}state.selection.fill(a==='all');state.captain=a==='all'?0:-1;render();return}if(a==='singleconfig'){const i=state.tasks.findIndex(t=>t.name===state.single);if(i>=0)config(i);else act('placeholder:秒装备配置');return}if(a==='tasktab'){document.querySelector('#overlay').innerHTML='';state.page='标定中心';render();return}if(a==='commontab'){notify('当前为通用标定');return}if(a==='listmenu'){drawer('清单管理',`<div class="toggle-menu">${btn('新建清单','placeholder:新建清单','','plus')}${btn('重命名清单','placeholder:重命名清单','','edit')}${btn('删除清单','placeholder:删除清单','','close')}</div>`);return}if(a.startsWith('calibrate:')){drawer('标定预览','<div class="notice">布局占位，不调用截图或真实标定。</div>'+btn('返回','close','primary'));return}drawer(a==='settings'?'设置与关于':a==='region'?'识别区域':a==='sizes'?'窗口尺寸组':a==='addshot'?'添加截图':a.startsWith('editstep:')?'编辑步骤':a.replace('placeholder:',''),'<div class="notice">交互占位，不执行真实操作。</div>'+btn('返回','close','primary'))}
let dragIndex;document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){state.page=p.dataset.page;render();return}const tab=e.target.closest('[data-single]');if(tab){if(state.running)return;state.single=tab.dataset.single;render();document.querySelector('[role=tab][aria-selected=true]').focus();return}const c=e.target.closest('[data-config]');if(c){config(Number(c.dataset.config));return}const a=e.target.closest('[data-action]');if(a)act(a.dataset.action)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.role!==undefined){state.selection[Number(t.dataset.role)]=t.checked;if(!state.selection[state.captain])state.captain=state.selection.indexOf(true);render()}else if(t.dataset.captain!==undefined){state.captain=Number(t.dataset.captain);render()}else if(t.dataset.task!==undefined){state.tasks[Number(t.dataset.task)].on=t.checked;render()}else if(t.id==='mode'){state.tasks[state.selected].live=t.value==='live';render();debug()}else if(t.id==='time'){state.time=Math.max(0,Number(t.value)||0);render();debug()}});
document.addEventListener('dragstart',e=>{const r=e.target.closest('[data-drag]');if(r){dragIndex=Number(r.dataset.drag);e.dataTransfer.setData('text/plain',String(dragIndex))}});document.addEventListener('dragover',e=>{if(e.target.closest('[data-drag]'))e.preventDefault()});document.addEventListener('drop',e=>{const r=e.target.closest('[data-drag]');if(r&&!state.running&&Number.isInteger(dragIndex)){e.preventDefault();state.tasks.splice(Number(r.dataset.drag),0,state.tasks.splice(dragIndex,1)[0]);dragIndex=undefined;render()}});
document.addEventListener('keydown',e=>{const tab=e.target.closest('[data-single]');if(tab&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();if(state.running)return;const i=singleTasks.findIndex(([n])=>n===state.single);const j=e.key==='Home'?0:e.key==='End'?singleTasks.length-1:(i+(e.key==='ArrowRight'?1:-1)+singleTasks.length)%singleTasks.length;state.single=singleTasks[j][0];render();document.querySelector('[role=tab][aria-selected=true]').focus();return}if(e.key==='Escape'){document.querySelector('#overlay').innerHTML='';state.logOpen=false;render()}});document.querySelector('#scenario').onclick=()=>{state.missing=!state.missing;render()};document.querySelector('#show-state').onclick=()=>{document.querySelector('#state-view').classList.toggle('hidden');debug()};const url=new URL(location.href);url.searchParams.set('variant','A');url.searchParams.set('version','3');history.replaceState(null,'',url);render();
</script></body></html>
